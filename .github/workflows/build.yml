name: Build Dylib
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Theos
        uses: Randomblock1/theos-action@v1
        
      - name: Build
        run: |
          make
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AutoLayer-dylib
          path: .theos/obj/AutoLayer.dylib
