name: Build Dylib
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          export THEOS=~/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
      - name: Build
        run: |
          export THEOS=~/theos
          export PATH=$THEOS/bin:$PATH
          make
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AutoLayer-dylib
          path: .theos/obj/AutoLayer.dylib
