name: Build Dylib
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Dependencies
        run: brew install ldid xz wget
        
      - name: Download Theos
        run: |
          mkdir -p $HOME/theos
          wget -q https://github.com/theos/theos/archive/refs/heads/master.zip -O theos.zip
          unzip -q theos.zip -d $HOME/
          mv $HOME/theos-master/* $HOME/theos/
          
      - name: Download SDK
        run: |
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip -O sdks.zip
          unzip -q sdks.zip -d $HOME/
          mkdir -p $HOME/theos/sdks
          mv $HOME/sdks-master/* $HOME/theos/sdks/
          
      - name: Build
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AutoLayer-dylib
          path: .theos/obj/AutoLayer.dylib
